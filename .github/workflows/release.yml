name: release
# Publishes a GitHub Release when a version tag is pushed (scripts/release.sh
# makes the tag). The tag must match VERSION, and the tests must pass first.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches VERSION
        run: |
          version=$(cat VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          fi
      - name: Build the release files
        run: scripts/build-release.sh dist
      - name: Write the release notes
        run: scripts/release-notes.sh "$(cat VERSION)" > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
