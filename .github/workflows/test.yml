name: test
on:
  push:
    branches: ['**'] # tags run these tests through the release workflow
  pull_request:
  workflow_call: # the release workflow runs these tests before publishing
jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: bin/dotfiles test
