<svg xmlns="http://www.w3.org/2000/svg" width="880" height="568" viewBox="0 0 880 568" role="img" aria-labelledby="title desc">
  <title id="title">The layers, in the order they load</title>
  <desc id="desc">Six rows, loaded top to bottom; each row can add to or override the rows above it. 1, sh/env.sh: shared PATH and exports. 2, hosts/profile/env.sh: the profile's PATH and exports. Rows 1 and 2 are the environment layer, loaded by every shell that reads a startup file. Non-interactive shells stop there. 3, zsh/rc.zsh or bash/rc.bash: aliases, functions, options, completion, prompt and tools. 4, hosts/profile/rc.zsh or rc.bash: the profile's interactive overrides. 5, your own lines below the block in ~/.zshrc or ~/.bashrc, on this machine only. 6, the plugins listed in _df_load_last, sourced once at the first zsh prompt. Rows 3 to 6 are the interactive layer.</desc>
  <style>
  :root, svg {
    --bg: #ffffff; --panel: #ffffff; --ground: #f5f7f9; --fg: #1a2027; --muted: #5a6572; --line: #c6ced6;
    --l1: #dcf0ec; --l1-edge: #2c8a7e; --l2: #f9ead2; --l2-edge: #a86d16; --l3: #e8e4f6; --l3-edge: #6656b0;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #11161b; --panel: #192028; --ground: #11161b; --fg: #e2e8ee; --muted: #9aa6b2; --line: #38424d;
      --l1: #143430; --l1-edge: #5cc4b5; --l2: #382a12; --l2-edge: #e2a74f; --l3: #25213f; --l3-edge: #a99ef2;
    }
  }
  svg { color: var(--muted); }
  .bg { fill: var(--bg); }
  .col { fill: var(--muted); font: 500 11px ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; }
  .mine { fill: var(--panel); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .b1 { fill: var(--l1); stroke: var(--l1-edge); stroke-width: 1.4; }
  .b2 { fill: var(--l2); stroke: var(--l2-edge); stroke-width: 1.4; }
  .b3d { fill: var(--l3); stroke: var(--l3-edge); stroke-width: 1.4; stroke-dasharray: 5 3; }
  .n { fill: var(--fg); font: 700 13px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .t { fill: var(--fg); font: 600 13px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .s { fill: var(--muted); font: 400 11.5px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .tag { fill: var(--muted); font: 500 11px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .lab { fill: var(--muted); font: italic 400 11.5px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .m { fill: var(--fg); font: 500 12.5px ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .arrow { fill: none; stroke: currentColor; stroke-width: 1.3; }
  .brace { fill: none; stroke: var(--line); stroke-width: 1.6; }
  .stop { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 4; }
</style>
  <rect class="bg" width="880" height="568" rx="12"/>
  <defs>
    <marker id="ls-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Load order, down the left -->
  <text class="col" x="24" y="40">Loads first</text>
  <line class="arrow" x1="52" y1="56" x2="52" y2="500" marker-end="url(#ls-ah)"/>
  <text class="col" x="24" y="524">Loads last</text>

  <!-- 1 -->
  <rect class="b1" x="84" y="56" width="520" height="56" rx="8"/>
  <text class="n" x="102" y="81">1</text>
  <text class="m" x="126" y="81">sh/env.sh</text>
  <text class="s" x="126" y="100">PATH and exported variables, every machine (OS differences in a case)</text>
  <text class="tag" x="590" y="81" text-anchor="end">shared</text>

  <!-- 2 -->
  <rect class="b1" x="84" y="124" width="520" height="56" rx="8"/>
  <text class="n" x="102" y="149">2</text>
  <text class="m" x="126" y="149">hosts/&lt;profile&gt;/env.sh</text>
  <text class="s" x="126" y="168">The profile's PATH and exports: its PATH entries come first</text>
  <text class="tag" x="590" y="149" text-anchor="end">profile</text>

  <!-- Stop line -->
  <line class="stop" x1="84" y1="204" x2="604" y2="204"/>
  <text class="lab" x="344" y="224" text-anchor="middle">non-interactive shells stop here</text>

  <!-- 3 -->
  <rect class="b2" x="84" y="240" width="520" height="56" rx="8"/>
  <text class="n" x="102" y="265">3</text>
  <text class="m" x="126" y="265">zsh/rc.zsh  or  bash/rc.bash</text>
  <text class="s" x="126" y="284">Aliases, functions, options, completion, prompt, tool setup</text>
  <text class="tag" x="590" y="265" text-anchor="end">shared</text>

  <!-- 4 -->
  <rect class="b2" x="84" y="308" width="520" height="56" rx="8"/>
  <text class="n" x="102" y="333">4</text>
  <text class="m" x="126" y="333">hosts/&lt;profile&gt;/rc.zsh  or  rc.bash</text>
  <text class="s" x="126" y="352">The profile's aliases and options: redefine or unalias anything above</text>
  <text class="tag" x="590" y="333" text-anchor="end">profile</text>

  <!-- 5 -->
  <rect class="mine" x="84" y="376" width="520" height="56" rx="8"/>
  <text class="n" x="102" y="401">5</text>
  <text class="t" x="126" y="401">Your lines below the block in ~/.zshrc or ~/.bashrc</text>
  <text class="s" x="126" y="420">Not versioned; where installers append their lines</text>
  <text class="tag" x="590" y="401" text-anchor="end">this machine</text>

  <!-- 6 -->
  <rect class="b3d" x="84" y="444" width="520" height="56" rx="8"/>
  <text class="n" x="102" y="469">6</text>
  <text class="m" x="126" y="469">_df_load_last plugins</text>
  <text class="s" x="126" y="488">Listed in rc.zsh; sourced once, at the first zsh prompt</text>
  <text class="tag" x="590" y="469" text-anchor="end">zsh only</text>

  <!-- Layer braces, on the right -->
  <path class="brace" d="M620 58 h10 v120 h-10"/>
  <text class="t" x="644" y="104">Environment</text>
  <text class="s" x="644" y="122">Every shell that reads a</text>
  <text class="s" x="644" y="138">startup file, including</text>
  <text class="s" x="644" y="154">zsh -c and ssh host cmd</text>

  <path class="brace" d="M620 242 h10 v256 h-10"/>
  <text class="t" x="644" y="352">Interactive</text>
  <text class="s" x="644" y="370">Only shells with a prompt</text>
  <text class="s" x="644" y="386">(zsh or bash)</text>

  <text class="s" x="84" y="548">Each row can add to or override the rows above it. PATH: each _df_path_prepend goes in front, so the last one is searched first.</text>
</svg>
