<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="676" viewBox="0 0 1040 676" role="img" aria-labelledby="title desc">
  <title id="title">Which files each shell reads, and what their blocks load</title>
  <desc id="desc">Every kind of shell start reaches the environment layer. zsh reads ~/.zshenv on every start, ~/.zprofile for login shells and ~/.zshrc for interactive ones. sh and desktop logins read ~/.profile. bash login shells read ~/.bash_profile, which sources ~/.profile and then ~/.bashrc if interactive. Interactive bash and ssh host commands read ~/.bashrc. The blocks in ~/.zshenv, ~/.zprofile and ~/.profile load the environment layer; the ~/.bashrc block loads it always and the interactive and bash layers if interactive; the ~/.zshrc block loads the interactive and zsh layers, and rc.zsh hooks load-last.zsh to the first prompt. Every path reaches layer 1, the environment. Only interactive shells reach layers 2 and 3. ~/.bash_profile sources ~/.profile, then ~/.bashrc if interactive. Each host file loads right after the shared file it overrides.</desc>
  <style>
  :root, svg {
    --bg: #ffffff; --panel: #ffffff; --ground: #f5f7f9; --fg: #1a2027; --muted: #5a6572; --line: #c6ced6;
    --l1: #dcf0ec; --l1-edge: #2c8a7e; --l2: #f9ead2; --l2-edge: #a86d16; --l3: #e8e4f6; --l3-edge: #6656b0;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #11161b; --panel: #192028; --ground: #11161b; --fg: #e2e8ee; --muted: #9aa6b2; --line: #38424d;
      --l1: #143430; --l1-edge: #5cc4b5; --l2: #382a12; --l2-edge: #e2a74f; --l3: #25213f; --l3-edge: #a99ef2;
    }
  }
  svg { color: var(--muted); }
  .bg { fill: var(--bg); }
  .col { fill: var(--muted); font: 500 11px ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; }
  .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
  .sys { fill: var(--ground); stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .b1 { fill: var(--l1); stroke: var(--l1-edge); stroke-width: 1.4; }
  .b2 { fill: var(--l2); stroke: var(--l2-edge); stroke-width: 1.4; }
  .b3 { fill: var(--l3); stroke: var(--l3-edge); stroke-width: 1.4; }
  .b3d { fill: var(--l3); stroke: var(--l3-edge); stroke-width: 1.4; stroke-dasharray: 5 3; }
  .sw1 { fill: var(--l1-edge); } .sw2 { fill: var(--l2-edge); } .sw3 { fill: var(--l3-edge); }
  .swm { fill: none; stroke: var(--muted); stroke-width: 1.2; }
  .sws { fill: var(--ground); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 2; }
  .t { fill: var(--fg); font: 600 13px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .ts { fill: var(--muted); font: 500 12.5px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .lane { fill: var(--fg); font: 600 12.5px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .s { fill: var(--muted); font: 400 11.5px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .lab { fill: var(--muted); font: italic 400 11.5px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .m { fill: var(--fg); font: 500 12.5px ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .sm { fill: var(--muted); font: 400 11.5px ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .arrow { fill: none; stroke: currentColor; stroke-width: 1.3; }
</style>
  <rect class="bg" width="1040" height="676" rx="12"/>
  <g transform="translate(20 20)">

          <defs>
            <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
            </marker>
          </defs>

          <text class="col" x="16" y="18">Shell starts</text>
          <text class="col" x="348" y="18">Reads at startup</text>
          <text class="col" x="680" y="18">Its block loads</text>

          <!-- Column A: kinds of shell start -->
          <rect class="box" x="16" y="42" width="268" height="44" rx="6"/>
          <text class="t" x="30" y="61">Every zsh</text>
          <text class="s" x="30" y="77">zsh -c, scripts, coding agents</text>

          <rect class="box" x="16" y="102" width="268" height="44" rx="6"/>
          <text class="t" x="30" y="121">zsh login shell</text>
          <text class="s" x="30" y="137">macOS Terminal opens these</text>

          <rect class="box" x="16" y="162" width="268" height="44" rx="6"/>
          <text class="t" x="30" y="181">sh login, desktop login</text>
          <text class="s" x="30" y="197">GDM and other display managers</text>

          <rect class="box" x="16" y="242" width="268" height="44" rx="6"/>
          <text class="t" x="30" y="261">bash login shell</text>
          <text class="s" x="30" y="277">bash -l, ssh into bash</text>

          <rect class="box" x="16" y="322" width="268" height="44" rx="6"/>
          <text class="t" x="30" y="341">Interactive bash</text>
          <text class="s" x="30" y="357">also ssh host cmd, when bash</text>

          <rect class="box" x="16" y="422" width="268" height="44" rx="6"/>
          <text class="t" x="30" y="441">Interactive zsh</text>
          <text class="s" x="30" y="457">every new zsh terminal</text>

          <!-- A to B -->
          <line class="arrow" x1="284" y1="64" x2="344" y2="64" marker-end="url(#ah)"/>
          <line class="arrow" x1="284" y1="124" x2="344" y2="124" marker-end="url(#ah)"/>
          <line class="arrow" x1="284" y1="184" x2="344" y2="184" marker-end="url(#ah)"/>
          <line class="arrow" x1="284" y1="264" x2="344" y2="264" marker-end="url(#ah)"/>
          <line class="arrow" x1="284" y1="344" x2="344" y2="344" marker-end="url(#ah)"/>
          <line class="arrow" x1="284" y1="444" x2="344" y2="444" marker-end="url(#ah)"/>

          <!-- Column B: entry files -->
          <rect class="box" x="348" y="42" width="192" height="44" rx="6"/>
          <text class="m" x="364" y="69">~/.zshenv</text>
          <rect class="box" x="348" y="102" width="192" height="44" rx="6"/>
          <text class="m" x="364" y="129">~/.zprofile</text>
          <rect class="box" x="348" y="162" width="192" height="44" rx="6"/>
          <text class="m" x="364" y="189">~/.profile</text>
          <rect class="box" x="348" y="242" width="192" height="44" rx="6"/>
          <text class="m" x="364" y="269">~/.bash_profile</text>
          <rect class="box" x="348" y="322" width="192" height="44" rx="6"/>
          <text class="m" x="364" y="349">~/.bashrc</text>
          <rect class="box" x="348" y="422" width="192" height="44" rx="6"/>
          <text class="m" x="364" y="449">~/.zshrc</text>

          <!-- ~/.bash_profile sources the other two -->
          <line class="arrow" x1="390" y1="242" x2="390" y2="210" marker-end="url(#ah)"/>
          <text class="lab" x="400" y="230">1. sources</text>
          <line class="arrow" x1="390" y1="286" x2="390" y2="318" marker-end="url(#ah)"/>
          <text class="lab" x="400" y="306">2. then, if interactive</text>

          <!-- B to C -->
          <line class="arrow" x1="540" y1="64" x2="676" y2="64" marker-end="url(#ah)"/>
          <line class="arrow" x1="540" y1="124" x2="676" y2="108" marker-end="url(#ah)"/>
          <text class="lab" x="546" y="142">again, after path_helper</text>
          <line class="arrow" x1="540" y1="184" x2="676" y2="156" marker-end="url(#ah)"/>
          <line class="arrow" x1="540" y1="332" x2="676" y2="196" marker-end="url(#ah)"/>
          <text class="lab" x="588" y="270" text-anchor="end">always</text>
          <line class="arrow" x1="540" y1="342" x2="676" y2="282" marker-end="url(#ah)"/>
          <line class="arrow" x1="540" y1="354" x2="676" y2="372" marker-end="url(#ah)"/>
          <text class="lab" x="566" y="346">if interactive</text>
          <line class="arrow" x1="540" y1="436" x2="676" y2="400" marker-end="url(#ah)"/>
          <line class="arrow" x1="540" y1="452" x2="676" y2="488" marker-end="url(#ah)"/>

          <!-- Column C: layers -->
          <rect class="b1" x="680" y="36" width="304" height="176" rx="8"/>
          <text class="t" x="696" y="60">1 · Environment</text>
          <text class="s" x="968" y="60" text-anchor="end">every shell</text>
          <text class="m" x="732" y="96">sh/env.sh</text>
          <text class="s" x="696" y="124">then</text>
          <text class="m" x="732" y="124">sh/os/&lt;os&gt;.sh</text>
          <text class="s" x="696" y="152">then</text>
          <text class="m" x="732" y="152">hosts/&lt;profile&gt;/env.sh</text>
          <text class="s" x="696" y="194">POSIX sh · silent · exports only</text>

          <rect class="b3" x="680" y="232" width="304" height="84" rx="8"/>
          <text class="t" x="696" y="256">3 · bash only</text>
          <text class="s" x="968" y="256" text-anchor="end">interactive bash</text>
          <text class="m" x="696" y="282">bash/rc.bash</text>
          <text class="sm" x="696" y="302">then hosts/&lt;profile&gt;/rc.bash</text>

          <rect class="b2" x="680" y="336" width="304" height="84" rx="8"/>
          <text class="t" x="696" y="360">2 · Interactive</text>
          <text class="s" x="968" y="360" text-anchor="end">bash and zsh</text>
          <text class="m" x="696" y="386">sh/interactive.sh</text>
          <text class="sm" x="696" y="406">then hosts/&lt;profile&gt;/interactive.sh</text>

          <rect class="b3" x="680" y="440" width="304" height="84" rx="8"/>
          <text class="t" x="696" y="464">3 · zsh only</text>
          <text class="s" x="968" y="464" text-anchor="end">interactive zsh</text>
          <text class="m" x="696" y="490">zsh/rc.zsh</text>
          <text class="sm" x="696" y="510">then hosts/&lt;profile&gt;/rc.zsh</text>

          <line class="arrow" x1="832" y1="524" x2="832" y2="564" marker-end="url(#ah)"/>
          <text class="lab" x="842" y="549">registers a hook</text>
          <rect class="b3d" x="680" y="568" width="304" height="54" rx="8"/>
          <text class="m" x="696" y="591">zsh/load-last.zsh</text>
          <text class="s" x="696" y="609">once, at the first prompt</text>
  </g>
</svg>
