<svg xmlns="http://www.w3.org/2000/svg" width="1088" height="392" viewBox="0 0 1088 392" role="img" aria-labelledby="title desc">
  <title id="title">The order inside one login shell</title>
  <desc id="desc">A zsh login and interactive shell runs ~/.zshenv with the environment layer and your lines, the system zprofile where macOS path_helper reorders PATH, ~/.zprofile with the environment layer again, the system zshrc, ~/.zshrc with rc.zsh, the profile's rc.zsh and your lines, then the load-last plugins at the first prompt. A bash login and interactive shell runs the system profile, the ~/.bash_profile block, ~/.profile with the environment layer and your lines, ~/.bashrc with the environment layer again, rc.bash, the profile's rc.bash and your lines, and finally the rest of ~/.bash_profile. Each entry file runs its block first, then your own lines below it. Login shells load the environment layer twice, which is harmless because it is idempotent; in zsh the second load puts the repo PATH back in front after macOS path_helper.</desc>
  <style>
  :root, svg {
    --bg: #ffffff; --panel: #ffffff; --ground: #f5f7f9; --fg: #1a2027; --muted: #5a6572; --line: #c6ced6;
    --l1: #dcf0ec; --l1-edge: #2c8a7e; --l2: #f9ead2; --l2-edge: #a86d16; --l3: #e8e4f6; --l3-edge: #6656b0;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #11161b; --panel: #192028; --ground: #11161b; --fg: #e2e8ee; --muted: #9aa6b2; --line: #38424d;
      --l1: #143430; --l1-edge: #5cc4b5; --l2: #382a12; --l2-edge: #e2a74f; --l3: #25213f; --l3-edge: #a99ef2;
    }
  }
  svg { color: var(--muted); }
  .bg { fill: var(--bg); }
  .col { fill: var(--muted); font: 500 11px ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; }
  .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
  .sys { fill: var(--ground); stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .b1 { fill: var(--l1); stroke: var(--l1-edge); stroke-width: 1.4; }
  .b2 { fill: var(--l2); stroke: var(--l2-edge); stroke-width: 1.4; }
  .b3 { fill: var(--l3); stroke: var(--l3-edge); stroke-width: 1.4; }
  .b3d { fill: var(--l3); stroke: var(--l3-edge); stroke-width: 1.4; stroke-dasharray: 5 3; }
  .sw1 { fill: var(--l1-edge); } .sw2 { fill: var(--l2-edge); } .sw3 { fill: var(--l3-edge); }
  .swm { fill: none; stroke: var(--muted); stroke-width: 1.2; }
  .sws { fill: var(--ground); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 2; }
  .t { fill: var(--fg); font: 600 13px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .ts { fill: var(--muted); font: 500 12.5px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .lane { fill: var(--fg); font: 600 12.5px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .s { fill: var(--muted); font: 400 11.5px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .lab { fill: var(--muted); font: italic 400 11.5px system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif; }
  .m { fill: var(--fg); font: 500 12.5px ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .sm { fill: var(--muted); font: 400 11.5px ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .arrow { fill: none; stroke: currentColor; stroke-width: 1.3; }
</style>
  <rect class="bg" width="1088" height="392" rx="12"/>
  <g transform="translate(20 20)">

          <defs>
            <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
            </marker>
          </defs>

          <!-- Lane 1: zsh -->
          <text class="lane" x="4" y="16">zsh, login and interactive</text>
          <text class="s" x="190" y="16">for example, a new macOS Terminal window</text>

          <rect class="box" x="4" y="28" width="150" height="112" rx="7"/>
          <text class="m" x="16" y="50">~/.zshenv</text>
          <rect class="sw1" x="16" y="64" width="8" height="8" rx="1.5"/>
          <text class="s" x="30" y="72">env layer</text>
          <rect class="swm" x="16" y="82" width="8" height="8" rx="1.5"/>
          <text class="s" x="30" y="90">your lines</text>

          <line class="arrow" x1="154" y1="84" x2="178" y2="84" marker-end="url(#ah2)"/>

          <rect class="sys" x="182" y="28" width="150" height="112" rx="7"/>
          <text class="ts" x="194" y="50">system zprofile</text>
          <text class="s" x="194" y="72">macOS: path_helper</text>
          <text class="s" x="194" y="90">reorders PATH</text>

          <line class="arrow" x1="332" y1="84" x2="356" y2="84" marker-end="url(#ah2)"/>

          <rect class="box" x="360" y="28" width="150" height="112" rx="7"/>
          <text class="m" x="372" y="50">~/.zprofile</text>
          <rect class="sw1" x="372" y="64" width="8" height="8" rx="1.5"/>
          <text class="s" x="386" y="72">env layer again</text>
          <text class="s" x="386" y="90">repo PATH first</text>
          <rect class="swm" x="372" y="100" width="8" height="8" rx="1.5"/>
          <text class="s" x="386" y="108">your lines</text>

          <line class="arrow" x1="510" y1="84" x2="534" y2="84" marker-end="url(#ah2)"/>

          <rect class="sys" x="538" y="28" width="150" height="112" rx="7"/>
          <text class="ts" x="550" y="50">system zshrc</text>
          <text class="s" x="550" y="72">Ubuntu's compinit</text>
          <text class="s" x="550" y="90">is skipped</text>

          <line class="arrow" x1="688" y1="84" x2="712" y2="84" marker-end="url(#ah2)"/>

          <rect class="box" x="716" y="28" width="150" height="112" rx="7"/>
          <text class="m" x="728" y="50">~/.zshrc</text>
          <rect class="sw2" x="728" y="64" width="8" height="8" rx="1.5"/>
          <text class="s" x="742" y="72">rc.zsh + host</text>
          <rect class="swm" x="728" y="82" width="8" height="8" rx="1.5"/>
          <text class="s" x="742" y="90">your lines</text>

          <line class="arrow" x1="866" y1="84" x2="890" y2="84" marker-end="url(#ah2)"/>

          <rect class="b3d" x="894" y="28" width="150" height="112" rx="7"/>
          <text class="ts" x="906" y="50">first prompt</text>
          <text class="m" x="906" y="72">_df_load_last</text>
          <text class="s" x="906" y="90">then the hook</text>
          <text class="s" x="906" y="106">removes itself</text>

          <!-- Lane 2: bash -->
          <text class="lane" x="4" y="176">bash, login and interactive</text>
          <text class="s" x="194" y="176">for example, bash -l in a terminal</text>

          <rect class="sys" x="4" y="188" width="150" height="112" rx="7"/>
          <text class="ts" x="16" y="210">system profile</text>
          <text class="s" x="16" y="232">macOS: path_helper</text>

          <line class="arrow" x1="154" y1="244" x2="178" y2="244" marker-end="url(#ah2)"/>

          <rect class="box" x="182" y="188" width="150" height="112" rx="7"/>
          <text class="m" x="194" y="210">~/.bash_profile</text>
          <text class="s" x="194" y="232">its block only:</text>
          <text class="s" x="194" y="250">sources ~/.profile,</text>
          <text class="s" x="194" y="268">then ~/.bashrc</text>

          <line class="arrow" x1="332" y1="244" x2="356" y2="244" marker-end="url(#ah2)"/>

          <rect class="box" x="360" y="188" width="150" height="112" rx="7"/>
          <text class="m" x="372" y="210">~/.profile</text>
          <rect class="sw1" x="372" y="224" width="8" height="8" rx="1.5"/>
          <text class="s" x="386" y="232">env layer</text>
          <rect class="swm" x="372" y="242" width="8" height="8" rx="1.5"/>
          <text class="s" x="386" y="250">your lines</text>

          <line class="arrow" x1="510" y1="244" x2="534" y2="244" marker-end="url(#ah2)"/>

          <rect class="box" x="538" y="188" width="150" height="112" rx="7"/>
          <text class="m" x="550" y="210">~/.bashrc</text>
          <text class="lab" x="538" y="182">if interactive:</text>
          <rect class="sw1" x="550" y="224" width="8" height="8" rx="1.5"/>
          <text class="s" x="564" y="232">env layer again</text>
          <rect class="sw2" x="550" y="242" width="8" height="8" rx="1.5"/>
          <text class="s" x="564" y="250">rc.bash + host</text>
          <rect class="swm" x="550" y="260" width="8" height="8" rx="1.5"/>
          <text class="s" x="564" y="268">your lines</text>

          <line class="arrow" x1="688" y1="244" x2="712" y2="244" marker-end="url(#ah2)"/>

          <rect class="box" x="716" y="188" width="150" height="112" rx="7"/>
          <text class="m" x="728" y="210">~/.bash_profile</text>
          <text class="s" x="728" y="232">after its block:</text>
          <rect class="swm" x="728" y="242" width="8" height="8" rx="1.5"/>
          <text class="s" x="742" y="250">your lines, last</text>

  <g transform="translate(4 324)">
    <rect class="sw1" x="0" y="0" width="12" height="12" rx="2"/><text class="s" x="18" y="10">Environment: env.sh</text>
    <rect class="sw2" x="170" y="0" width="12" height="12" rx="2"/><text class="s" x="188" y="10">Interactive: rc.zsh or rc.bash</text>
    <rect class="swm" x="400" y="0.5" width="11" height="11" rx="2"/><text class="s" x="418" y="10">Your lines below the block</text>
    <rect class="sws" x="602" y="0.5" width="11" height="11" rx="2"/><text class="s" x="620" y="10">System file, not managed</text>
  </g>
  </g>
</svg>
