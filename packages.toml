# packages.toml: tools for `dotfiles install`.
# One table per logical tool, mapping each package manager to its package name.
# Omit a manager to skip the tool there. `required` tools are reported by doctor.

[ripgrep]
required = true
brew = "ripgrep"
apt = "ripgrep"
dnf = "ripgrep"
pacman = "ripgrep"

[fd]
required = true
brew = "fd"
apt = "fd-find"
dnf = "fd-find"
pacman = "fd"

[fzf]
brew = "fzf"
apt = "fzf"
dnf = "fzf"
pacman = "fzf"

[mise]
brew = "mise"
