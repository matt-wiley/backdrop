# packages.toml: tools for `dotfiles install`.
# One table per logical tool, mapping each package manager to its package name.
# Omit a manager to skip the tool there. `required` tools are reported by doctor.
# `bin` lists the commands that count as installed (any one); default: the name.
# `mise = "SPEC"` installs the tool with `mise use -g SPEC` instead of the
# package manager; use it for runtimes, e.g. [node] mise = "node@lts".
# hosts/<profile>/packages.toml adds tools; a table there replaces the shared one.

[ripgrep]
bin = "rg"
required = true
brew = "ripgrep"
apt = "ripgrep"
dnf = "ripgrep"
pacman = "ripgrep"

[fd]
bin = "fd fdfind"
required = true
brew = "fd"
apt = "fd-find"
dnf = "fd-find"
pacman = "fd"

[fzf]
brew = "fzf"
apt = "fzf"
dnf = "fzf"
pacman = "fzf"

[mise]
brew = "mise"
